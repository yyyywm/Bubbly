<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubbly</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="setup-panel">
  <div id="setup-drag">
    <h2>💕 Bubbly</h2>
    <p class="subtitle">与对方配对，开始聊天</p>
    <p class="hint">双击桌宠发送消息 · 双击状态灯返回设置</p>
  </div>

  <div class="form-area">
    <div class="input-group">
      <label>服务器地址</label>
      <input id="inp-server" type="text" value="ws://localhost:8080" placeholder="ws://localhost:8080">
    </div>
    <div class="input-group">
      <label>房间号</label>
      <input id="inp-room" type="text" placeholder="输入共同房间号" maxlength="20">
    </div>
    <div class="input-group">
      <label>你的昵称</label>
      <input id="inp-nickname" type="text" placeholder="如：小狗 / 小猫" maxlength="10">
    </div>
    <div class="input-group">
      <label>桌宠大小</label>
      <div class="scale-group">
        <button class="scale-btn" data-scale="50">小</button>
        <button class="scale-btn" data-scale="75">中</button>
        <button class="scale-btn active" data-scale="100">大</button>
        <button class="scale-btn" data-scale="125">特大</button>
      </div>
    </div>
  </div>

  <div class="connect-area">
    <button id="btn-connect">💕 连接</button>
    <div id="setup-status">欢迎使用 💕</div>
  </div>
</div>

<div id="pet-area">
  <div id="bubble-container"></div>
  <div id="reconnect-hint">已断开，双击状态灯重连</div>
  <div id="pet-container">
    <div id="pet-body">
      <div class="pet-ear left"></div>
      <div class="pet-ear right"></div>
      <div class="pet-eye left"></div>
      <div class="pet-eye right"></div>
      <div class="pet-nose"></div>
      <div class="pet-mouth"></div>
      <div class="pet-cheek left"></div>
      <div class="pet-cheek right"></div>
    </div>
  </div>
  <div id="status-dot"></div>
  <div id="input-panel">
    <div class="input-row">
      <input id="msg-input" type="text" placeholder="发送消息…" maxlength="50">
      <button class="send-btn" id="btn-send">发送</button>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
