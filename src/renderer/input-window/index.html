<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Bubbly 输入窗口</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 260px;
  height: 56px;
  overflow: hidden;
  background: transparent;
  user-select: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'PingFang SC', 'Microsoft YaHei', sans-serif;
}
#input-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#input-box {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 4px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
  -webkit-app-region: drag;
}
#msg-input {
  flex: 1;
  border: none;
  outline: none;
  padding: 4px 8px;
  font-size: 12px;
  cursor: text;
  border-radius: 8px;
  -webkit-app-region: no-drag;
}
#msg-input::placeholder { color: #ccc; }
.send-btn {
  border: none;
  background: linear-gradient(135deg, #ff6b9d, #ff8a65);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  -webkit-app-region: no-drag;
  transition: transform 0.1s ease;
}
.send-btn:hover { transform: translateY(-1px); }
.send-btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div id="input-wrap">
  <div id="input-box">
    <input id="msg-input" type="text" placeholder="发送消息… (Enter 发送 · Esc 关闭)" maxlength="50">
    <button class="send-btn" id="btn-send">发送</button>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
