# ============================================================
#  持续集成流水线
# ============================================================
#  触发: push 到 main / develop，或针对这两个分支的 PR
#  内容: 多 Node 版本矩阵执行 ESLint 代码检查 + 单元/集成测试
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'  # 测试无需 Electron 二进制

      - name: ESLint 代码检查
        run: npm run lint

      - name: 单元与集成测试
        run: npm test
